                                            </span>
                                        </div>
                                        <div className="text-[15px] font-bold text-gray-800 mb-0.5">{proj.org[lang]}</div>
                                        <div className="text-[14px] font-medium text-gray-500 mb-4">{proj.role[lang]}</div>
                                        
                                        <p className="text-[16px] text-gray-700 leading-relaxed font-medium mb-6 text-justify">
                                            {proj.desc[lang]}
                                        </p>
                                        
                                        <div className="flex flex-wrap items-center justify-between gap-4 mt-auto pt-4 border-t border-gray-100">
                                            <div className="flex flex-wrap gap-2">
                                                {proj.tags[lang].map((tag, tIdx) => (
                                                    <span key={tIdx} className="text-[13px] px-2 py-0.5 bg-gray-50 text-gray-600 rounded border border-gray-200 font-medium">
                                                        #{tag}
                                                    </span>
                                                ))}
                                            </div>
                                            <button 
                                                onClick={() => setSelectedProject(proj)} 
                                                className="inline-flex items-center text-[14px] font-bold text-blue-700 hover:text-blue-900 transition-colors"
                                            >
                                                {t.view_detail_btn} &rarr;
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Tab: Learning Highlights Gallery (學習剪影) */}
                    {activeTab === 'gallery' && (
                        <div className="animate-fade-in pb-10">
                            {/* Filter category pills */}
                            <div className="flex flex-wrap gap-3 mb-10 pb-4 border-b border-gray-200">
                                {[
                                    { key: 'all', label: t.gallery_all },
                                    { key: 'overseas', label: t.gallery_overseas },
                                    { key: 'awards', label: t.gallery_awards },
                                    { key: 'projects', label: t.gallery_projects }
                                ].map((cat) => (
                                    <button 
                                        key={cat.key}
                                        onClick={() => setGalleryFilter(cat.key)}
                                        className={`text-[14px] font-bold px-3.5 py-1.5 rounded-sm transition-colors ${galleryFilter === cat.key ? 'bg-gray-800 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                                    >
                                        {cat.label}
                                    </button>
                                ))}
                            </div>

                            <div className="gallery-grid">
                                {filteredGallery.map((item) => (
                                    <div 
                                        key={item.id} 
                                        onClick={() => setSelectedGalleryItem(item)}
                                        className="flex flex-col gap-3 group cursor-pointer bg-white border border-gray-200 p-3 rounded-sm hover:border-gray-400 transition-all shadow-xs"
                                    >
                                        <div className="w-full aspect-[4/3] bg-gray-50 overflow-hidden relative">
                                            <img 
                                                src={item.src} 
                                                alt={item.caption[lang]} 
                                                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                                                onError={(e) => handleImageError(e, item.src.split('/').pop())}
                                            />
                                            <div className="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors flex items-center justify-center">
                                                <span className="text-white text-xs font-bold px-2 py-1 bg-black/60 rounded-sm opacity-0 group-hover:opacity-100 transition-opacity">
                                                    {t.view_detail_btn}
                                                </span>
                                            </div>
                                        </div>
                                        <div>
                                            <h4 className="text-[15.5px] font-bold text-gray-900 leading-snug group-hover:text-blue-700 transition-colors">
                                                {item.caption[lang]}
                                            </h4>
                                            <p className="text-[13.5px] text-gray-500 line-clamp-2 mt-1 leading-relaxed">
                                                {item.desc[lang]}
                                            </p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* MODAL 1: Professional Project Detailed View */}
                    {selectedProject && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white max-w-2xl w-full max-h-[90vh] overflow-y-auto rounded-sm border border-gray-300 p-6 md:p-8 shadow-xl relative animate-fade-in">
                                <button 
                                    onClick={() => setSelectedProject(null)}
                                    className="absolute top-6 right-6 text-gray-400 hover:text-gray-700 transition-colors"
                                >
                                    <CloseIcon />
                                </button>
                                
                                <span className="text-[13px] font-bold text-gray-500 bg-gray-100 px-2.5 py-1 rounded-sm">
                                    {selectedProject.period}
                                </span>
                                <h3 className="text-2xl font-bold text-gray-900 mt-3 mb-1">{selectedProject.title[lang]}</h3>
                                <div className="text-[15px] font-bold text-gray-700 mb-6">{selectedProject.org[lang]}・{selectedProject.role[lang]}</div>
                                
                                <div className="space-y-5 text-[15.5px] text-gray-700 leading-relaxed font-medium">
                                    <div className="bg-gray-50 p-4 rounded-sm border border-gray-200">
                                        <h4 className="text-[14px] font-bold text-gray-900 mb-1.5">{lang === 'zh' ? '背景與問題意識' : 'Context & Challenge'}</h4>
                                        <p className="text-justify">{selectedProject.details.context[lang]}</p>
                                    </div>

                                    <div className="bg-gray-50 p-4 rounded-sm border border-gray-200">
                                        <h4 className="text-[14px] font-bold text-gray-900 mb-1.5">{lang === 'zh' ? '執行方法與實踐' : 'Execution & Methodology'}</h4>
                                        <p className="text-justify">{selectedProject.details.implementation[lang]}</p>
                                    </div>

                                    <div className="bg-gray-50 p-4 rounded-sm border border-gray-200">
                                        <h4 className="text-[14px] font-bold text-gray-900 mb-1.5">{lang === 'zh' ? '實務觀察與研究反思' : 'Key Takeaways & Reflection'}</h4>
                                        <p className="text-justify">{selectedProject.details.reflection[lang]}</p>
                                    </div>
                                </div>

                                <div className="mt-8 pt-4 border-t border-gray-200 flex justify-end">
                                    <button 
                                        onClick={() => setSelectedProject(null)}
                                        className="px-5 py-1.5 bg-gray-800 text-white text-[14px] font-bold rounded-sm hover:bg-gray-900 transition-colors"
                                    >
                                        {t.close_modal}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 2: Learning Highlights Detailed Lightbox */}
                    {selectedGalleryItem && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white max-w-xl w-full max-h-[90vh] overflow-y-auto rounded-sm border border-gray-300 p-6 shadow-xl relative animate-fade-in">
                                <button 
                                    onClick={() => setSelectedGalleryItem(null)}
                                    className="absolute top-5 right-5 text-gray-400 hover:text-gray-700 transition-colors"
                                >
                                    <CloseIcon />
                                </button>
                                
                                <div className="w-full aspect-[4/3] bg-gray-100 overflow-hidden mb-5 border border-gray-200">
                                    <img 
                                        src={selectedGalleryItem.src} 
                                        alt={selectedGalleryItem.caption[lang]} 
                                        className="w-full h-full object-cover"
                                        onError={(e) => handleImageError(e, selectedGalleryItem.src.split('/').pop())}
                                    />
                                </div>

                                <h3 className="text-xl font-bold text-gray-900 mb-3">{selectedGalleryItem.caption[lang]}</h3>
                                <p className="text-[15.5px] text-gray-700 leading-relaxed text-justify font-medium mb-6">
                                    {selectedGalleryItem.desc[lang]}
                                </p>

                                <div className="pt-4 border-t border-gray-200 flex justify-end">
                                    <button 
                                        onClick={() => setSelectedGalleryItem(null)}
                                        className="px-5 py-1.5 bg-gray-800 text-white text-[14px] font-bold rounded-sm hover:bg-gray-900 transition-colors"
                                    >
                                        {t.close_modal}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="mt-24 pt-8 border-t border-gray-200 text-center text-[13px] text-gray-400 font-bold tracking-widest uppercase">
                        © 2026 YIN, KO-YING.
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
