                                <h2 className="text-xl font-bold mb-6 serif-font">{t.section_overseas}</h2>
                                <div className="flex flex-col md:flex-row gap-8 items-center bg-gray-50 border border-gray-100 p-6 md:p-8 rounded-sm">
                                    <div className="w-full md:w-2/3">
                                        <h3 className="text-lg font-bold text-gray-900 mb-3">{t.overseas.title}</h3>
                                        <p className="text-[14px] font-medium text-gray-700 leading-relaxed text-justify">
                                            {t.overseas.desc}
                                        </p>
                                    </div>
                                    <div className="w-full md:w-1/3 aspect-[4/3] bg-white border border-gray-200 overflow-hidden shadow-sm">
                                        <img 
                                            src="images/life.jpg" 
                                            alt="Overseas Apprenticeship"
                                            className="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-500"
                                            onError={(e) => handleImageError(e, 'life.jpg')}
                                        />
                                    </div>
                                </div>
                            </section>

                        </div>
                    ) : (
                        <div className="animate-fade-in pb-10">
                            
                            {/* Awards Gallery */}
                            <div className="mb-16">
                                <h2 className="text-lg font-bold mb-6 serif-font pb-2 border-b border-gray-100">{t.gallery_awards}</h2>
                                <div className="gallery-grid">
                                    {galleryData.awards.map((img, idx) => (
                                        <div key={idx} className="flex flex-col gap-3 group">
                                            <div className="w-full aspect-[4/3] bg-gray-50 border border-gray-200 overflow-hidden">
                                                <img 
                                                    src={img.src} 
                                                    alt={img.caption} 
                                                    className="w-full h-full object-cover hover:scale-105 transition-transform duration-500"
                                                    onError={(e) => handleImageError(e, img.src.split('/').pop())}
                                                />
                                            </div>
                                            <p className="text-[13px] font-medium text-center text-gray-500">{img.caption}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Projects Gallery */}
                            <div className="mb-16">
                                <h2 className="text-lg font-bold mb-6 serif-font pb-2 border-b border-gray-100">{t.gallery_projects}</h2>
                                <div className="gallery-grid">
                                    {galleryData.projects.map((img, idx) => (
                                        <div key={idx} className="flex flex-col gap-3 group">
                                            <div className="w-full aspect-[4/3] bg-gray-50 border border-gray-200 overflow-hidden">
                                                <img 
                                                    src={img.src} 
                                                    alt={img.caption} 
                                                    className="w-full h-full object-cover hover:scale-105 transition-transform duration-500"
                                                    onError={(e) => handleImageError(e, img.src.split('/').pop())}
                                                />
                                            </div>
                                            <p className="text-[13px] font-medium text-center text-gray-500">{img.caption}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Overseas Gallery */}
                            <div>
                                <h2 className="text-lg font-bold mb-6 serif-font pb-2 border-b border-gray-100">{t.gallery_overseas}</h2>
                                <div className="gallery-grid">
                                    {galleryData.overseas.map((img, idx) => (
                                        <div key={idx} className="flex flex-col gap-3 group">
                                            <div className="w-full aspect-[4/3] bg-gray-50 border border-gray-200 overflow-hidden">
                                                <img 
                                                    src={img.src} 
                                                    alt={img.caption} 
                                                    className="w-full h-full object-cover hover:scale-105 transition-transform duration-500"
                                                    onError={(e) => handleImageError(e, img.src.split('/').pop())}
                                                />
                                            </div>
                                            <p className="text-[13px] font-medium text-center text-gray-500">{img.caption}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="mt-20 pt-8 border-t border-gray-200 text-center text-[11px] text-gray-400 font-bold tracking-widest uppercase">
                        © 2026 YIN, KO-YING.
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
