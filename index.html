                                    <button
                                        key={tab.id}
                                        onClick={() => setGalleryFilter(tab.id)}
                                        className={`px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all ${
                                            galleryFilter === tab.id
                                            ? 'bg-gray-900 text-white shadow-sm'
                                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                        }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            {/* Gallery Card Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredGallery.map((item) => (
                                    <div 
                                        key={item.id} 
                                        onClick={() => setSelectedPhoto(item)}
                                        className="group bg-white border border-gray-200 rounded-sm overflow-hidden hover:border-gray-400 transition-all duration-200 cursor-pointer flex flex-col h-full"
                                    >
                                        <div className="w-full aspect-[4/3] bg-gray-100 relative overflow-hidden shrink-0">
                                            <img 
                                                src={item.src} 
                                                alt={item.title[lang]} 
                                                className="w-full h-full object-cover group-hover:scale-102 transition-transform duration-300"
                                                onError={(e) => handleImageError(e, item.src.split('/').pop())}
                                            />
                                            <div className="absolute top-2.5 left-2.5 z-10">
                                                <span className="text-[10px] font-semibold px-2 py-0.5 bg-black/60 text-white rounded-sm">
                                                    {item.date}
                                                </span>
                                            </div>
                                        </div>

                                        <div className="p-4 flex flex-col flex-grow">
                                            <div className="flex items-center gap-1 text-[11px] text-gray-400 mb-1">
                                                <MapPin size={12} className="text-gray-400 shrink-0" />
                                                <span className="truncate">{item.location[lang]}</span>
                                            </div>

                                            <h3 className="text-[14px] font-bold text-gray-900 leading-snug mb-2 group-hover:text-blue-900 transition-colors">
                                                {item.title[lang]}
                                            </h3>

                                            <p className="text-[12px] text-gray-600 leading-relaxed line-clamp-2 mb-3 flex-grow">
                                                {item.desc[lang]}
                                            </p>

                                            <div className="flex flex-wrap gap-1 mt-auto pt-2.5 border-t border-gray-100">
                                                {item.tags.map((tag, tIdx) => (
                                                    <span key={tIdx} className="text-[10px] px-1.5 py-0.5 bg-slate-50 text-slate-600 rounded border border-slate-200">
                                                        #{tag}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {selectedPhoto && (
                        <div 
                            className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4 md:p-8 animate-fade-in"
                            onClick={() => setSelectedPhoto(null)}
                        >
                            <div 
                                className="bg-white max-w-3xl w-full max-h-[90vh] overflow-y-auto rounded-sm shadow-2xl relative flex flex-col md:flex-row overflow-hidden"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="w-full md:w-3/5 bg-gray-950 flex items-center justify-center relative aspect-[4/3] md:aspect-auto">
                                    <img 
                                        src={selectedPhoto.src} 
                                        alt={selectedPhoto.title[lang]}
                                        className="w-full h-full object-contain max-h-[60vh] md:max-h-full"
                                        onError={(e) => handleImageError(e, selectedPhoto.src.split('/').pop())}
                                    />
                                    <button 
                                        onClick={handlePrevPhoto} 
                                        aria-label="Previous"
                                        className="absolute left-2 top-1/2 -translate-y-1/2 p-2 rounded-full bg-black/50 text-white hover:bg-black/70 transition-colors"
                                    >
                                        <ChevronLeft size={18} />
                                    </button>
                                    <button 
                                        onClick={handleNextPhoto} 
                                        aria-label="Next"
                                        className="absolute right-2 top-1/2 -translate-y-1/2 p-2 rounded-full bg-black/50 text-white hover:bg-black/70 transition-colors"
                                    >
                                        <ChevronRight size={18} />
                                    </button>
                                </div>

                                <div className="w-full md:w-2/5 p-6 flex flex-col justify-between bg-white">
                                    <div>
                                        <div className="flex justify-between items-start mb-4">
                                            <span className="text-[10px] font-semibold uppercase tracking-wider text-slate-500 bg-slate-100 px-2 py-0.5 rounded">
                                                {selectedPhoto.category}
                                            </span>
                                            <button 
                                                onClick={() => setSelectedPhoto(null)} 
                                                className="text-gray-400 hover:text-gray-800 transition-colors p-1"
                                                title="Close"
                                            >
                                                <XIcon size={18} />
                                            </button>
                                        </div>

                                        <h3 className="text-base font-bold text-gray-900 serif-font leading-snug mb-3">
                                            {selectedPhoto.title[lang]}
                                        </h3>

                                        <div className="space-y-1 mb-4 text-xs text-gray-500 pb-3 border-b border-gray-100">
                                            <div className="flex items-center gap-1.5">
                                                <Calendar size={13} className="text-gray-400" />
                                                <span>{selectedPhoto.date}</span>
                                            </div>
                                            <div className="flex items-center gap-1.5">
                                                <MapPin size={13} className="text-gray-400" />
                                                <span>{selectedPhoto.location[lang]}</span>
                                            </div>
                                        </div>

                                        <div className="mb-4">
                                            <h4 className="text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-2">
                                                {t.modal_context}
                                            </h4>
                                            <p className="text-[13px] text-gray-700 leading-relaxed text-justify">
                                                {selectedPhoto.desc[lang]}
                                            </p>
                                        </div>
                                    </div>

                                    <div className="pt-4 border-t border-gray-100 mt-4">
                                        <div className="flex flex-wrap gap-1.5 mb-3">
                                            {selectedPhoto.tags.map((tag, idx) => (
                                                <span key={idx} className="text-[10px] px-2 py-0.5 bg-gray-100 text-gray-600 rounded">
                                                    #{tag}
                                                </span>
                                            ))}
                                        </div>
                                        <div className="flex justify-end items-center text-xs">
                                            <button 
                                                onClick={() => setSelectedPhoto(null)} 
                                                className="text-xs text-gray-600 hover:text-gray-900 underline underline-offset-2"
                                            >
                                                {t.modal_back}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="mt-20 pt-8 border-t border-gray-200 text-center text-[11px] text-gray-400 font-medium tracking-wider">
                        © 2026 YIN, KO-YING
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
