                                        key={item.id} 
                                        onClick={() => setSelectedGalleryItem(item)}
                                        className="flex flex-col gap-4 group cursor-pointer bg-white border border-gray-200 p-4 rounded-sm hover:border-gray-400 transition-all shadow-xs"
                                    >
                                        <div className="w-full aspect-[4/3] bg-gray-50 overflow-hidden relative border border-gray-100">
                                            <img 
                                                src={item.src} 
                                                alt={item.caption[lang]} 
                                                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                                                onError={(e) => handleImageError(e, item.src.split('/').pop())}
                                            />
                                            <div className="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors flex items-center justify-center">
                                                <span className="text-white text-[14px] font-bold px-3 py-1.5 bg-black/60 rounded-sm opacity-0 group-hover:opacity-100 transition-opacity">
                                                    {t.view_detail_btn}
                                                </span>
                                            </div>
                                        </div>
                                        <div>
                                            <h4 className="text-[17px] font-bold text-gray-900 leading-snug group-hover:text-blue-700 transition-colors">
                                                {item.caption[lang]}
                                            </h4>
                                            <p className="text-[15px] text-gray-500 line-clamp-2 mt-1.5 leading-relaxed">
                                                {item.desc[lang]}
                                            </p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Tab: Issues of Interest (�𨀣釣霅圈�) */}
                    {activeTab === 'issues' && (
                        <main className="animate-fade-in pb-16">
                            <div className="max-w-3xl mb-10 md:mb-14">
                                <span className="text-[12px] font-bold text-emerald-800 tracking-[0.18em] uppercase">{t.issue_intro_label}</span>
                                <h2 className="text-3xl md:text-4xl font-bold serif-font text-gray-900 leading-snug mt-3 mb-5">{t.issue_intro_title}</h2>
                                <p className="text-[17px] text-gray-600 leading-relaxed">{t.issue_intro}</p>
                            </div>

                            {!selectedIssue ? (
                                <>
                                    <div className="mb-9">
                                        <h3 className="text-[14px] font-bold text-gray-700 mb-4">{t.issue_categories_label}</h3>
                                        <div className="flex flex-wrap gap-2.5" role="group" aria-label={t.issue_categories_label}>
                                            {[{ id: 'all', name: t.issue_all }, ...t.issue_categories.map((name, id) => ({ id, name }))].map((category) => (
                                                <button
                                                    key={category.id}
                                                    type="button"
                                                    onClick={() => setIssueFilter(category.id)}
                                                    aria-pressed={issueFilter === category.id}
                                                    className={`px-4 py-2 text-[14px] font-bold rounded-full border transition-colors ${issueFilter === category.id ? 'bg-emerald-900 text-white border-emerald-900' : 'bg-white text-gray-600 border-gray-200 hover:border-emerald-700 hover:text-emerald-900'}`}
                                                >{category.name}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <h3 className="text-[14px] font-bold text-gray-700 mb-5">{t.issue_articles_label}</h3>
                                    {filteredIssues.length === 0 ? (
                                        <p className="border border-gray-200 bg-gray-50 rounded-sm p-6 text-gray-600">{t.issue_empty}</p>
                                    ) : <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {filteredIssues.map((article, index) => (
                                        <article key={article.id} className={`group bg-white border border-gray-200 rounded-sm overflow-hidden hover:border-gray-400 hover:shadow-md transition-all ${index === 0 ? 'md:col-span-2 md:flex' : ''}`}>
                                            <div className={`bg-slate-100 overflow-hidden ${index === 0 ? 'md:w-[43%] md:shrink-0' : ''}`}>
                                                <img
                                                    src={article.image || issueCover}
                                                    alt={article[lang].imageAlt}
                                                    onError={(e) => { e.currentTarget.onerror = null; e.currentTarget.src = issueCover; }}
                                                    className={`w-full object-cover ${index === 0 ? 'aspect-[16/10] md:h-full' : 'aspect-[16/9]'}`}
                                                />
                                            </div>
                                            <div className="p-6 md:p-8 flex flex-col justify-center">
                                                <div className="text-[13px] font-bold tracking-wide text-emerald-800 mb-3">{t.issue_categories[article.categoryId]} <span className="text-gray-300 mx-2">繚</span> {article.date}</div>
                                                <h3 className="text-2xl font-bold serif-font text-gray-900 leading-snug mb-3">{article[lang].title}</h3>
                                                <p className="text-[16px] text-gray-600 leading-relaxed mb-6">{article[lang].summary}</p>
                                                <button
                                                    onClick={() => { setSelectedIssueId(article.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                                    className="self-start text-[15px] font-bold text-emerald-900 border-b border-emerald-800 pb-1 hover:text-emerald-700 transition-colors"
                                                >
                                                    {t.issue_read} &rarr;
                                                </button>
                                            </div>
                                        </article>
                                    ))}
                                </div>}
                                </>
                            ) : (
                                <article className="max-w-3xl mx-auto">
                                    <button
                                        onClick={() => { setSelectedIssueId(null); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                        className="text-[15px] font-bold text-gray-600 hover:text-emerald-800 transition-colors mb-9"
                                    >
                                        &larr; {t.issue_back}
                                    </button>
                                    <div className="text-[13px] font-bold tracking-wide text-emerald-800 mb-4">{t.issue_categories[selectedIssue.categoryId]} <span className="text-gray-300 mx-2">繚</span> {selectedIssue.date}</div>
                                    <h3 className="text-3xl md:text-4xl font-bold serif-font text-gray-900 leading-snug mb-4">{selectedIssue[lang].title}</h3>
                                    <p className="text-[18px] text-gray-600 leading-relaxed mb-8">{selectedIssue[lang].summary}</p>
                                    <figure className="mb-10">
                                        <img
                                            src={selectedIssue.image || issueCover}
                                            alt={selectedIssue[lang].imageAlt}
                                            onError={(e) => { e.currentTarget.onerror = null; e.currentTarget.src = issueCover; }}
                                            className="w-full aspect-[16/9] object-cover border border-gray-200 rounded-sm"
                                        />
                                    </figure>
                                    <div className="space-y-6 text-[17px] text-gray-700 leading-[1.9]">
                                        {selectedIssue[lang].paragraphs.map((paragraph, index) => <p key={index}>{paragraph}</p>)}
                                    </div>
                                    <section className="border-t border-gray-200 mt-12 pt-9">
                                        <h4 className="text-xl font-bold text-gray-900 mb-5">{t.issue_questions}</h4>
                                        <ul className="space-y-3 list-disc pl-6 text-[16px] text-gray-700 leading-relaxed">
                                            {selectedIssue[lang].questions.map((question, index) => <li key={index}>{question}</li>)}
                                        </ul>
                                    </section>
                                    <section className="border-t border-gray-200 mt-10 pt-9">
                                        <h4 className="text-xl font-bold text-gray-900 mb-5">{t.issue_sources}</h4>
                                        <ul className="space-y-3 text-[15px] leading-relaxed">
                                            {selectedIssue.sources.map((source) => (
                                                <li key={source.url}>
                                                    <a href={source.url} target="_blank" rel="noopener noreferrer" className="text-emerald-900 underline underline-offset-4 decoration-emerald-700/50 hover:text-emerald-700 break-words">
                                                        {source.label} &nearr;
                                                    </a>
                                                </li>
                                            ))}
                                        </ul>
                                    </section>
                                </article>
                            )}
                        </main>
                    )}

                    {/* MODAL 1: Professional Project Detailed View */}
                    {selectedProject && (
                        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white max-w-2xl w-full max-h-[90vh] overflow-y-auto rounded-sm border border-gray-300 p-8 shadow-xl relative animate-fade-in">
                                <button 
                                    onClick={() => setSelectedProject(null)}
                                    className="absolute top-6 right-6 text-gray-400 hover:text-gray-700 transition-colors"
                                >
                                    <CloseIcon />
                                </button>
                                
                                <span className="text-[14px] font-bold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-sm inline-block mb-4">
                                    {selectedProject.period}
                                </span>
                                <h3 className="text-2xl font-bold text-gray-900 mb-2">{selectedProject.title[lang]}</h3>
                                <div className="text-[16px] font-bold text-gray-700 mb-8 pb-4 border-b border-gray-200">
                                    {selectedProject.org[lang]}�認selectedProject.role[lang]}
                                </div>
                                
                                <div className="space-y-6 text-[16px] text-gray-700 leading-relaxed font-medium">
                                    <div className="bg-gray-50 p-5 rounded-sm border border-gray-200">
                                        <h4 className="text-[15px] font-bold text-gray-900 mb-2">{lang === 'zh' ? '撠���峕艶' : 'Background'}</h4>
                                        <p className="text-justify">{selectedProject.details.context[lang]}</p>
                                    </div>

                                    <div className="bg-gray-50 p-5 rounded-sm border border-gray-200">
                                        <h4 className="text-[15px] font-bold text-gray-900 mb-2">{lang === 'zh' ? '撌乩��批捆' : 'Responsibilities'}</h4>
                                        <p className="text-justify whitespace-pre-line">{selectedProject.details.implementation[lang]}</p>
                                    </div>

                                    <div className="bg-gray-50 p-5 rounded-sm border border-gray-200">
                                        <h4 className="text-[15px] font-bold text-gray-900 mb-2">{lang === 'zh' ? '撖血��齿��' : 'Reflections'}</h4>
                                        <p className="text-justify">{selectedProject.details.reflection[lang]}</p>
                                    </div>
                                </div>

                                <div className="mt-10 pt-5 border-t border-gray-200 flex justify-end">
                                    <button 
                                        onClick={() => setSelectedProject(null)}
                                        className="px-6 py-2 bg-gray-800 text-white text-[15px] font-bold rounded-sm hover:bg-gray-900 transition-colors"
                                    >
                                        {t.close_modal}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 2: Learning Highlights Detailed Lightbox */}
                    {selectedGalleryItem && (
                        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white max-w-2xl w-full max-h-[90vh] overflow-y-auto rounded-sm border border-gray-300 p-8 shadow-xl relative animate-fade-in">
                                <button 
                                    onClick={() => setSelectedGalleryItem(null)}
                                    className="absolute top-6 right-6 text-gray-400 hover:text-gray-700 transition-colors z-10"
                                >
                                    <CloseIcon />
                                </button>
                                
                                <div className="w-full aspect-[4/3] bg-gray-100 overflow-hidden mb-6 border border-gray-200">
                                    <img 
                                        src={selectedGalleryItem.src} 
                                        alt={selectedGalleryItem.caption[lang]} 
                                        className="w-full h-full object-cover"
                                        onError={(e) => handleImageError(e, selectedGalleryItem.src.split('/').pop())}
                                    />
                                </div>

                                <h3 className="text-2xl font-bold text-gray-900 mb-3">{selectedGalleryItem.caption[lang]}</h3>
                                <p className="text-[16.5px] text-gray-700 leading-relaxed text-justify font-medium mb-8">
                                    {selectedGalleryItem.desc[lang]}
                                </p>

                                <div className="pt-5 border-t border-gray-200 flex justify-end">
                                    <button 
                                        onClick={() => setSelectedGalleryItem(null)}
                                        className="px-6 py-2 bg-gray-800 text-white text-[15px] font-bold rounded-sm hover:bg-gray-900 transition-colors"
                                    >
                                        {t.close_modal}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="mt-24 pt-8 border-t border-gray-200 text-center text-[14px] text-gray-400 font-bold tracking-widest uppercase">
                        穢 2026 YIN, KO-YING.
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
